
{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій блог{% endblock %}</title>
</head>
<body>

<header>
    <h1>Мій блог</h1>
    <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'posts' %}">Публікації</a>
        <a href="{% url 'contact' %}">Контакти</a>
    </nav>
</header>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>© {{ year }} Мій блог</p>
</footer>

</body>
</html>
